<div id="statusArea" class="mt-8 hidden text-center">
    <div class="inline-block w-8 h-8 border-4 border-slate-200 border-t-blue-500 rounded-full animate-spin mb-2"></div>
    <p id="statusText" class="text-slate-600 font-bold text-sm">ミキシング中...</p>
</div>

<div id="previewArea" class="mt-8 hidden animate-in fade-in zoom-in duration-500">
    <h3 class="text-slate-700 font-bold text-sm mb-4">✨ 合成が完了しました！</h3>
    <video id="player" controls class="w-full rounded-2xl shadow-lg bg-black mb-4"></video>
    <a id="downloadBtn" class="block w-full bg-emerald-500 hover:bg-emerald-600 text-white text-center font-bold py-4 rounded-2xl transition-all">
        動画を保存する
    </a>
    <button onclick="location.reload()" class="mt-4 text-slate-400 text-xs hover:underline">別の動画を作る</button>
</div>

<script>
    // ... (中略: API_URLやスライダーの処理) ...

    document.getElementById('uploadForm').onsubmit = async (e) => {
        e.preventDefault();
        const btn = document.getElementById('submitBtn');
        const statusArea = document.getElementById('statusArea');
        const previewArea = document.getElementById('previewArea');
        const player = document.getElementById('player');
        const downloadBtn = document.getElementById('downloadBtn');
        
        btn.disabled = true;
        statusArea.classList.remove('hidden');
        previewArea.classList.add('hidden'); // 再挑戦時に隠す

        const formData = new FormData();
        formData.append('video', document.getElementById('video').files[0]);
        formData.append('audio', document.getElementById('audio').files[0]);
        formData.append('volume', document.getElementById('bgmVolume').value);

        try {
            const response = await fetch(API_URL, { method: 'POST', body: formData });
            if (!response.ok) throw new Error();
            
            const blob = await response.blob();
            const url = window.URL.createObjectURL(blob);
            
            // プレビューにセット
            player.src = url;
            downloadBtn.href = url;
            downloadBtn.download = `iiakome_mixed_${Date.now()}.mp4`;
            
            // 表示の切り替え
            statusArea.classList.add('hidden');
            previewArea.classList.remove('hidden');
            player.play(); // 自動再生
            
        } catch (error) {
            alert("エラーが発生しました。");
            statusArea.classList.add('hidden');
            btn.disabled = false;
        }
    };
</script>
